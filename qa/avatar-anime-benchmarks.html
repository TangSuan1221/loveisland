<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>角色组件辨识度验收</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edeade;color:#344039;font:14px system-ui}header{padding:21px 30px;border-bottom:1px solid #c5cdbe}h1{margin:0 0 6px;font-size:24px}header p{margin:0;color:#6d7b6a}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:#c5cdbe}.card{background:#edeade;min-width:0}.views{display:grid;grid-template-columns:repeat(2,1fr)}canvas{display:block;width:100%;height:auto}h2{font-size:19px;margin:13px 20px 3px}.card p{font-size:12px;color:#6d7b6a;margin:7px 20px 17px;line-height:1.6}.view{position:relative}.view span{position:absolute;left:15px;bottom:10px;color:#667160;font-size:10px}</style>
<header><h1></h1><p>同一共享模型 · 实际可编辑组件 · 正面 / 侧面 · 标签不能代替形象相似</p></header><main class="grid"></main>
<script type="module">
import * as THREE from 'three';import{createGPURenderer}from'../src/gpu-renderer.js';import{portraitActor,disposeActor}from'../src/characters.js';import{APPEARANCE_OPTIONS,normalizeAppearance}from'../src/avatar-schema.js';import{RECOGNITION_BENCHMARKS}from'./avatar-anime-benchmarks.js';
const params=new URLSearchParams(location.search),group=params.get('group')||'动漫',blind=params.has('blind'),profile=params.has('profile'),benchmarks=RECOGNITION_BENCHMARKS.filter(x=>x.group===group);document.querySelector('h1').textContent=`${group} · ${blind?'无名称观察':'特征覆盖基准'}`;
const renderer=await createGPURenderer({alpha:false});renderer.setSize(360,360);renderer.outputColorSpace=THREE.SRGBColorSpace;const scene=new THREE.Scene();scene.background=new THREE.Color('#edeade');const errors=[],outputs=[];
for(const [index,b]of benchmarks.entries()){
 for(const[k,v]of Object.entries(b.values))if(APPEARANCE_OPTIONS[k]&&!APPEARANCE_OPTIONS[k].some(o=>o.value===v))errors.push(`${b.id} ${k} ${v}`);
 const appearance=normalizeAppearance(b.values),a=portraitActor('recognition-'+b.id,{appearance});scene.add(a.mesh);const card=document.createElement('section');card.className='card';const h=document.createElement('h2');h.textContent=blind?`样本 ${String.fromCharCode(65+index)}`:b.name;const views=document.createElement('div');views.className='views';card.append(h,views);
 for(const[angle,name]of [[0,'正面'],[profile?Math.PI/2:.72,profile?'侧面 90°':'侧转 41°']]){a.mesh.rotation.y=angle;a.mesh.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(a._head),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());center.y-=.025;const camera=new THREE.PerspectiveCamera(30,1,.01,20),distance=Math.max(size.y,size.x)/(2*Math.tan(Math.PI/12))*1.18+size.z/2;camera.position.copy(center).add(new THREE.Vector3(0,0,distance));camera.lookAt(center);renderer.render(scene,camera);const cv=document.createElement('canvas');cv.width=cv.height=360;cv.getContext('2d').drawImage(renderer.domElement,0,0);const view=document.createElement('div');view.className='view';const label=document.createElement('span');label.textContent=name;view.append(cv,label);views.append(view);}
 const note=document.createElement('p');note.textContent=blind?'先看轮廓和五官，暂不显示目标名称。':b.mustHave.join(' · ');card.append(note);document.querySelector('.grid').append(card);outputs.push({id:b.id,name:b.name,appearance});disposeActor(a);
}window.benchmarkResult={backend:renderer.backend.constructor.name,errors,outputs};renderer.dispose();window.done=true;
</script></html>
