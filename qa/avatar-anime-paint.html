<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>彩绘遮挡实测</title><style>body{margin:0;background:#edeade;color:#344039;font:16px system-ui}h1,p{margin:16px 24px}main{display:grid;grid-template-columns:repeat(3,1fr)}section{text-align:center}canvas{width:100%;display:block}h2{font-size:16px}</style><h1>彩绘遮挡实测 · 非角色成品</h1><p>上排为原五官，下排用洋红色试验图层覆盖眼睛。使用真实 WebGPU 渲染；侧面用于检查悬浮、穿插。</p><main></main>
<script type="module">
import * as THREE from 'three';
import {createGPURenderer} from '../src/gpu-renderer.js';
import {portraitActor,disposeActor} from '../src/characters.js';
import {normalizeAppearance} from '../src/avatar-schema.js';
import {ANIME_PRESETS} from '../src/avatar-anime.js';
const renderer=await createGPURenderer({alpha:false});renderer.setSize(400,400);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color('#edeade');
const appearance=normalizeAppearance({...ANIME_PRESETS[1].values,hairFront:'none',hairBack:'none',faceArt:[{kind:'ellipse',x:.5,y:.425,width:.85,height:.40,color:'#ff00ff'}]});
const actor=portraitActor('paint-occlusion',{appearance});scene.add(actor.mesh);const paint=actor._head.getObjectByName('face-paint');const samples=[];
for(const visible of [false,true])for(const[angle,label]of [[0,'正面'],[.72,'侧转 41°'],[Math.PI/2,'侧面 90°']]){
 paint.visible=visible;actor.mesh.rotation.y=angle;actor.mesh.updateMatrixWorld(true);
 const center=actor._head.localToWorld(new THREE.Vector3(0,0,0));const camera=new THREE.PerspectiveCamera(30,1,.01,20);camera.position.copy(center).add(new THREE.Vector3(0,0,1.7));camera.lookAt(center);camera.updateMatrixWorld();renderer.render(scene,camera);
 const canvas=document.createElement('canvas');canvas.width=canvas.height=400;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(renderer.domElement,0,0);
 const sec=document.createElement('section');const h=document.createElement('h2');h.textContent=`${visible?'覆盖测试':'未彩绘'} · ${label}`;sec.append(h,canvas);document.querySelector('main').append(sec);
 if(angle===0)for(const[side,eye]of actor._eyes.entries())for(const[x,y,feature]of [[0,0,'瞳孔'],[0,.037,'上眼线'],[-.044,0,'内侧眼白'],[.044,0,'外侧眼白']]){
  const p=eye.localToWorld(new THREE.Vector3(x,y,0)).project(camera),px=Math.round((p.x*.5+.5)*400),py=Math.round((-.5*p.y+.5)*400),rgb=[...ctx.getImageData(px,py,1,1).data];samples.push({visible,side,feature,px,py,rgb});
 }
}
window.paintResult={backend:renderer.backend.constructor.name,samples};disposeActor(actor);renderer.dispose();window.done=true;
</script></html>
