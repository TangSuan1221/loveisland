<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>照片匹配实际对照</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edeade;color:#334039;font:14px system-ui}header{padding:24px 30px;border-bottom:1px solid #c9d0c3}h1{margin:0 0 8px;font-size:24px}header p{margin:0;color:#69796a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#c9d0c3}.card{background:#edeade;min-width:0}.card h2{margin:20px 24px 10px;font-size:20px}.card canvas{display:block;width:100%;height:auto}.card p{margin:10px 24px 20px;color:#61715f;line-height:1.7;min-height:76px}input{margin:15px 30px}</style>
<header><h1>照片 → 可编辑角色：真实自动结果对照</h1><p>同一张照片 · 同一套 WebGPU 模型与镜头 · 零手动候选选择 · 零云端调用</p></header>
<input type="file" id="photo" accept="image/png,image/jpeg,image/webp"><main class="grid"><section class="card"><h2>输入照片 · 面部裁剪</h2><canvas id="original" width="480" height="540"></canvas><p>直接裁剪输入照片，保留原始像素。照片不上传；此图只供本地验收。</p></section></main>
<script type="module">
import * as THREE from 'three';import{createGPURenderer}from'../src/gpu-renderer.js';import{portraitActor,disposeActor}from'../src/characters.js';import{APPEARANCE_OPTIONS}from'../src/avatar-schema.js';
const before=await fetch('./photo-match-before-result.json').then(r=>r.json()),after=await fetch('./photo-match-after-result.json').then(r=>r.json()),evidence=await fetch('./photo-fit-evidence.json').then(r=>r.json());
const label=(field,value)=>APPEARANCE_OPTIONS[field]?.find(o=>o.value===value)?.label||value;
const renderer=await createGPURenderer({alpha:false});renderer.setSize(480,540);renderer.outputColorSpace=THREE.SRGBColorSpace;const scene=new THREE.Scene();scene.background=new THREE.Color('#edeade');
const camera=new THREE.PerspectiveCamera(32,480/540,.01,20);camera.position.set(0,1.68,1.48);camera.lookAt(0,1.68,0);
for(const [title,result]of [['修复前 · 自动匹配',before],['修复后 · 自动匹配',after]]){const a=portraitActor('photo-qa',{appearance:result.appearance});scene.add(a.mesh);a.mesh.position.set(0,0,0);a.mesh.rotation.set(0,0,0);a.mesh.updateMatrixWorld(true);renderer.render(scene,camera);const card=document.createElement('section');card.className='card';const h=document.createElement('h2');h.textContent=title;const cv=document.createElement('canvas');cv.width=480;cv.height=540;cv.getContext('2d').drawImage(renderer.domElement,0,0);const p=document.createElement('p'),v=result.appearance;p.textContent=`${label('faceShape',v.faceShape)} · ${v.hairFront==='auto'?label('hairStyle',v.hairStyle):label('hairFront',v.hairFront)} / ${v.hairBack==='auto'?'整套后发':label('hairBack',v.hairBack)} · ${label('glasses',v.glasses)}。上传后直接应用，未点选或手调。`;card.append(h,cv,p);document.querySelector('.grid').append(card);disposeActor(a);}renderer.dispose();
document.querySelector('#photo').onchange=async e=>{const bitmap=await createImageBitmap(e.target.files[0]),p=evidence.landmarks,fw=(p[454].x-p[234].x)*bitmap.width,fh=(p[152].y-p[10].y)*bitmap.height,cx=(p[454].x+p[234].x)*bitmap.width/2,cy=(p[10].y+p[152].y)*bitmap.height/2-.06*fh,w=fw*1.75,h=w*540/480,left=Math.max(0,Math.min(bitmap.width-w,cx-w/2)),top=Math.max(0,Math.min(bitmap.height-h,cy-h/2));document.querySelector('#original').getContext('2d').drawImage(bitmap,left,top,w,h,0,0,480,540);bitmap.close();e.target.hidden=true;window.done=true;};window.ready=true;
</script></html>
