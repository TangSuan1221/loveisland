<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>WebGPU 场景验收</title><style>body{margin:0}canvas{display:block}</style><script type="module">
import * as THREE from 'three';
import {createGPURenderer} from '../src/gpu-renderer.js';
import {createIsland} from '../src/island.js';
const renderer=await createGPURenderer({alpha:false});renderer.setSize(1000,700);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;
document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#a8dad6');scene.add(new THREE.HemisphereLight('#e8f7e5','#a8b38b',1.6));const sun=new THREE.DirectionalLight('#fff1dc',2.3);sun.position.set(-25,40,22);sun.castShadow=true;scene.add(sun);
const island=createIsland(scene,{productionMode:true});
const camera=new THREE.PerspectiveCamera(37,1000/700,.1,220);camera.position.set(35,42,54);camera.lookAt(0,.8,0);
renderer.render(scene,camera);
const canvas=document.createElement('canvas');canvas.width=1000;canvas.height=700;const ctx=canvas.getContext('2d');ctx.drawImage(renderer.domElement,0,0);const data=ctx.getImageData(0,0,1000,700).data;
window.result={backend:renderer.backend.isWebGPUBackend?'webgpu':'other',colors:new Set(Array.from({length:1000},(_,i)=>Array.from(data.slice(i*2800,i*2800+3)).join(','))).size,info:renderer.info.render};
window.done=true;
</script></html>
