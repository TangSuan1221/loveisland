<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>新组件角色研究</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eeeade;color:#35433d;font:14px system-ui}header{padding:25px 32px;border-bottom:1px solid #cbd1c3}h1{font-size:25px;margin:0 0 8px;letter-spacing:3px}header p{margin:0;color:#6f7d71}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#cbd1c3}.card{background:#eeeade;position:relative}.card canvas{display:block;width:100%;height:auto}.card h2{margin:0 20px 6px;font-size:19px}.card p{margin:0 20px 20px;color:#6f7d71;font-size:12px}</style>
<header><h1>更多轮廓，更多人物</h1><p>新增组件搭配示例 · 真实 WebGPU 模型 · 可在角色工作室继续编辑</p></header><main class="grid"></main>
<script type="module">
import * as THREE from 'three';import{createGPURenderer}from'../src/gpu-renderer.js';import{portraitActor,disposeActor}from'../src/characters.js';import{ART_PRESETS}from'../src/avatar-schema.js';
const r=await createGPURenderer({alpha:false});r.setSize(480,390);r.outputColorSpace=THREE.SRGBColorSpace;const scene=new THREE.Scene();scene.background=new THREE.Color('#eeeade');
for(const p of ART_PRESETS.slice(6)){const a=portraitActor('study',{appearance:p.values});scene.add(a.mesh);a.mesh.rotation.y=-.16;a.mesh.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(a._head),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),camera=new THREE.PerspectiveCamera(30,480/390,.01,20),d=Math.max(size.y/(2*Math.tan(Math.PI/12)),size.x/(2*Math.tan(Math.PI/12)*480/390))*1.16+size.z/2;center.y-=.025;camera.position.copy(center).add(new THREE.Vector3(0,0,d));camera.lookAt(center);r.render(scene,camera);const card=document.createElement('section');card.className='card';const cv=document.createElement('canvas');cv.width=480;cv.height=390;cv.getContext('2d').drawImage(r.domElement,0,0);const h=document.createElement('h2');h.textContent=p.name;const note=document.createElement('p');note.textContent=p.note;card.append(cv,h,note);document.querySelector('.grid').append(card);disposeActor(a);}r.dispose();window.done=true;
</script></html>
